name: iOS CI

on:
  push:
    branches:
      - main
      - "chatgpt/**"
  pull_request:

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build Noty for iPad simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Noty.xcodeproj \
            -scheme Noty \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Compile Noty tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Noty.xcodeproj \
            -scheme Noty \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
