name: iOS CI

on:
  push:
    branches:
      - main
      - "chatgpt/**"
      - "codex/**"
  pull_request:

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build Noty for iPad simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Noty.xcodeproj \
            -scheme Noty \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Select iPad simulator
        run: |
          NOTY_SIM_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if "iPad" in d["name"]))')
          echo "NOTY_TEST_DESTINATION=platform=iOS Simulator,id=$NOTY_SIM_ID" >> "$GITHUB_ENV"

      - name: Run Noty integration tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Noty.xcodeproj \
            -scheme Noty \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "$NOTY_TEST_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO \
            -resultBundlePath NotyTests.xcresult \
            test

      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NotyTests
          path: NotyTests.xcresult
          if-no-files-found: ignore
